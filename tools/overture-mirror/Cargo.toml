[package]
name = "overture-mirror"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures = "0.3.34"
object_store = { version = "0.14", features = ["aws"] }
thiserror = "2"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1"
tempfile = "3"
