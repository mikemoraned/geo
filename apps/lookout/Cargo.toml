[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# `tokio-rustls-comp` gives async TLS streams, but redis 0.27 only parses a
# `rediss://` URL when `tls-rustls` is also enabled (otherwise `Client::open`
# fails with InvalidClientConfig). `tls-rustls-webpki-roots` bundles CA roots so
# TLS to upstash doesn't depend on the runtime image's system cert store.
redis = { version = "0.27", features = ["tokio-rustls-comp", "tls-rustls", "tls-rustls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
# `bundled` compiles a pinned SQLite from source, so the recorder doesn't depend on
# a system libsqlite3 being present or new enough. It also builds SQLite with the
# R*Tree module (`-DSQLITE_ENABLE_RTREE`), used by the geo enrichment for a spatial
# index over the `transport` table — no separate rusqlite feature is needed for it.
rusqlite = { version = "0.40", features = ["bundled"] }
# `bundled` compiles libduckdb from source (no system libduckdb needed); the geo
# `enrich` bin uses it in-process to fetch Overture transport data from S3.
duckdb = { version = "1", features = ["bundled"] }
md5 = "0.7"
tempfile = "3"
shared = { path = "crates/shared" }
telemetry = { path = "crates/telemetry" }

[workspace.lints.clippy]
all = "warn"
