# Standalone workspace: this crate targets `xtensa-esp32-espidf`, so it must not be pulled
# into the host-targeted lookout workspace above it.
[workspace]

[package]
name = "spike2-shell"
version = "0.1.0"
authors = ["Mike Moran <mike@houseofmoran.com>"]
edition = "2024"
resolver = "2"
rust-version = "1.90"

[[bin]]
name = "spike2-shell"
path = "src/bin/spike2_shell.rs"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
mipidsi = "0.10.0"
embedded-graphics = "0.8.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Imported directly, not over FFI: a Rust shell needs no typegen or bridge.
spike2-core = { path = "../core" }
crux_core = "0.19.0"

[build-dependencies]
embuild = "0.33"
