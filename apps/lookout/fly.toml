app = 'lookout-hom'
primary_region = 'lhr'

[build]

[env]
  LOOKOUT_ORIGIN = 'https://lookout-hom.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
