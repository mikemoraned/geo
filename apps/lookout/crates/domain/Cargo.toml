[package]
name = "domain"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Written out rather than inherited: this crate builds for Xtensa and for wasm, and neither
# has the `std` the workspace default would bring. See docs/device.md.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
geo-types = { workspace = true }
num-traits = { version = "0.2", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
