[package]
name = "evaluation"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "evaluate"
required-features = ["cli"]

[dependencies]
chrono = { workspace = true }
clap = { workspace = true, optional = true }
code_version = { workspace = true }
crossings = { workspace = true }
datafusion = { workspace = true }
domain = { workspace = true }
futures = { workspace = true }
geo = { workspace = true }
geo-types = { workspace = true }
itertools = { workspace = true }
medallion = { workspace = true }
medallion-model = { workspace = true }
predictor = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
statrs = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
uuid = { workspace = true }

[build-dependencies]
code_version = { workspace = true }

[features]
cli = ["dep:clap", "dep:tokio", "dep:tracing-subscriber"]
fixtures = ["domain/fixtures"]

[dev-dependencies]
domain = { workspace = true, features = ["fixtures"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
