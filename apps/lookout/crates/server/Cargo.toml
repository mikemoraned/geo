[package]
name = "server"
version = "0.1.0"
edition.workspace = true
default-run = "server"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
redis = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
shared = { workspace = true }
telemetry = { workspace = true }
webauthn-rs = { version = "0.5", features = ["conditional-ui", "danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"
tower-sessions = "0.15"
# Builds the OpenSSL that webauthn-rs links into the binary. Without `vendored`, the build
# needs a system OpenSSL, and so does the runtime image.
openssl = { version = "0.10", features = ["vendored"] }
rand = "0.9"
base32 = "0.5"
backon = "1.6"
chrono = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
domain = { workspace = true }
tokio-tungstenite = "0.29"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
test-redis = { workspace = true }
passkey = { version = "0.6", features = ["rust-crypto"] }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
