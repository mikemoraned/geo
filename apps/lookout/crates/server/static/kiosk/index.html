<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lookout — kiosk</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; }
      h1 a { color: inherit; text-decoration: none; }
      footer { margin-top: 2rem; color: #888; font-size: 0.85rem; }
      #version { font-family: ui-monospace, monospace; }
      #map { display: none; }
      @media (min-width: 768px) {
        body { margin: 0; }
        #map { display: block; position: fixed; inset: 0; }
        #panel {
          position: fixed; top: 1rem; right: 1rem; width: 22rem; padding: 1rem;
          background: rgb(255 255 255 / 0.92); border-radius: 0.5rem;
          box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 0.2);
        }
        h1 { margin-top: 0; }
        footer { margin-top: 1rem; }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <main id="panel">
      <h1><a href="/">Lookout</a> — kiosk</h1>
      <p id="intro">Recorded journeys, replayed.</p>
      <lookout-predictor></lookout-predictor>
      <p id="said"></p>
      <footer>version: <span id="version">…</span></footer>
    </main>
    <script type="module" src="/kiosk/kiosk.js"></script>
    <script type="module" src="/version.js"></script>
  </body>
</html>
