<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lookout</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; }
      #status { font-weight: bold; }
      dt { font-weight: bold; margin-top: 0.5rem; }
      dd { font-family: ui-monospace, monospace; white-space: pre; margin: 0; }
      button { font-size: 1.1rem; padding: 0.6rem 1.2rem; }
      footer { margin-top: 2rem; color: #888; font-size: 0.85rem; }
      #version { font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>Lookout</h1>
    <p>Gathering GPS and accelerometer (<code>DeviceMotionEvent</code>) data on this device.</p>
    <button id="start">Start gathering</button>
    <p>status: <span id="status">idle</span></p>
    <dl>
      <dt>device id</dt>
      <dd id="id">—</dd>
      <dt>accel (<span id="accel-count">0</span> samples)</dt>
      <dd id="accel">—</dd>
      <dt>gps (<span id="gps-count">0</span> samples)</dt>
      <dd id="gps">—</dd>
    </dl>
    <footer>version: <span id="version">…</span></footer>
    <script src="/app.js"></script>
  </body>
</html>
