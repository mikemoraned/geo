[package]
name = "platform-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Some entries are written out rather than inherited from the workspace: see docs/device.md.
# Pinned back from 0.20, which reboots this board within seconds of its first event, inside
# its own per-effect machinery and with no BLE anywhere near it. See docs/device.md. Unpinning
# costs an associated type; leaving it unpinned costs a device that does not stay up.
crux_core = "=0.16.2"
battery-estimator = "0.3"
bytemuck = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
geo-types = { workspace = true }
predictor = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# The same crate again, for the captured sentences its tests share with this crate's. A
# dev-dependency, so the feature is off in anything built for the device.
predictor = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
