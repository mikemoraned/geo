[package]
name = "rerun-py"
version = "0.1.0"
edition.workspace = true

# A python extension module, so a cdylib. The `pyo3/extension-module` feature is left for
# maturin to enable (see pyproject.toml): with it on, the library does not link libpython,
# which is what a `cargo test` build of this crate would need.
[lib]
name = "lookout_predictor"
crate-type = ["cdylib"]
# Its tests are the python ones under `tests/`: a rust test binary for an extension module
# has no interpreter to run in and aborts on start.
test = false
doctest = false

[dependencies]
chrono = { workspace = true }
predictor = { workspace = true }
# `chrono` carries a python `datetime` across as a `DateTime<Utc>`, which is what a sample
# and a prediction are timed by. Without it every instant would cross as a number and the
# timezone would be the caller's to remember.
pyo3 = { workspace = true, features = ["chrono"] }

[lints]
workspace = true
