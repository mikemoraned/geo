[build]
target = "xtensa-esp32-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.5.3"
# One copy of the ESP-IDF checkout and its toolchains, in `~/.espressif`, shared by every git
# worktree this repo is worked in. The template's `workspace` default puts 4.3 GB under each
# one instead.
#
# The first build installs ESP-IDF there. After each new pip release, the first build to run the
# `esp-idf-sys` build script also writes there, upgrading pip in ESP-IDF's Python environment.
# Every other build needs only to read it, including one that rebuilds ESP-IDF itself. So a
# sandbox confined to this repo can build against an install it cannot write. Only those builds
# have to run outside it.
ESP_IDF_TOOLS_INSTALL_DIR = "global"
