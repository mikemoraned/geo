[package]
name = "m5-core"
version = "0.1.0"
edition.workspace = true
rust-version = "1.100"

[dependencies]
# Must match the core's pin — see `../../../platform-core/Cargo.toml`.
crux_core = "=0.20.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
domain = { workspace = true }
platform-core = { workspace = true }
predictor = { workspace = true }

[dev-dependencies]
# The same crate again, for the places its tests are set in. A dev-dependency, so the feature
# is off in anything built for the device.
domain = { workspace = true, features = ["fixtures"] }
test-predictor = { workspace = true }
# The countries the carried crossings are checked against; a dev-dependency, so nothing built
# for the device carries the store.
geo = { workspace = true }
geo-types = { workspace = true }
medallion = { workspace = true }

[lints]
workspace = true
