[package]
name = "web-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Pinned to match `platform-core`: 0.20 reboots the board, and one crux version across both
# cores keeps the shared core of phase 2 buildable for either shell. See docs/device.md.
crux_core = "=0.16.2"
chrono = { workspace = true }
serde = { workspace = true }

[features]
# Declared so the generator `#[effect(typegen)]` emits behind it compiles when asked for.
# Nothing enables it: the shell reads the bridge's JSON without generated bindings.
typegen = ["crux_core/typegen"]

[lints]
workspace = true
