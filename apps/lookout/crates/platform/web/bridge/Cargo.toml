[package]
name = "web-bridge"
version = "0.1.0"
edition.workspace = true

[lib]
# `cdylib` is what wasm-pack links; `rlib` keeps the crate testable on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
crux_core = "=0.16.2"
serde_json = { workspace = true }
wasm-bindgen = "0.2"
platform-core = { workspace = true }
web-core = { workspace = true }

# geo pulls in rand, whose getrandom builds for wasm32-unknown-unknown only with `js`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
