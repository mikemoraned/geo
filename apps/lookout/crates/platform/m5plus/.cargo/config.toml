[build]
target = "xtensa-esp32-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [ "--cfg",  "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.5.3"
# One copy of the ESP-IDF checkout and its toolchains, in `~/.espressif`, shared by every git
# worktree this repo is worked in. The template's `workspace` default puts 4.3 GB under each
# one instead.
#
# Only the first build writes there; later builds read it, including those that rebuild ESP-IDF
# itself. So a sandbox confined to this repo can build against an install it could not have
# created — the one-time install has to be run outside it.
ESP_IDF_TOOLS_INSTALL_DIR = "global"
