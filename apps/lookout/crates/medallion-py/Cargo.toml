[package]
name = "medallion-py"
version = "0.1.0"
edition.workspace = true

# A python extension module, so a cdylib. The `pyo3/extension-module` feature is left for
# maturin to enable (see pyproject.toml): with it on, the library does not link libpython,
# which is what a `cargo test` build of this crate would need.
[lib]
name = "lookout_medallion"
crate-type = ["cdylib"]
# Its tests are the python ones under `tests/`: a rust test binary for an extension module
# has no interpreter to run in and aborts on start.
test = false
doctest = false

[dependencies]
medallion = { workspace = true }
model = { workspace = true }
pyo3 = { workspace = true }
pyo3-arrow = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
