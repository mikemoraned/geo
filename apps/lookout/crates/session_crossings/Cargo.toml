[package]
name = "session_crossings"
version = "0.1.0"
edition.workspace = true

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
domain = { workspace = true }
geo = { workspace = true }
geo-types = { workspace = true }
medallion = { workspace = true }
medallion-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The same crate again, for the places its tests are set in. A dev-dependency, so the feature
# is off in anything else that builds this crate.
domain = { workspace = true, features = ["fixtures"] }
geojson = { workspace = true }
libtest-mimic = { workspace = true }
recorder = { workspace = true }
serde_json = { workspace = true }
shared = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

# No harness: this target builds a trial per test case at run time, so a failure names the case.
[[test]]
name = "geo"
harness = false

[lints]
workspace = true
