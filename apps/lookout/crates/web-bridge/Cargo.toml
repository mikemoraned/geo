[package]
name = "web-bridge"
version = "0.1.0"
edition.workspace = true

[lib]
# `cdylib` is what wasm-pack links; `rlib` keeps the crate testable on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
crux_core = "=0.16.2"
serde_json = { workspace = true }
wasm-bindgen = "0.2"
web-core = { workspace = true }

[lints]
workspace = true
