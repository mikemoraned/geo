[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "lookout-session-crossings"
version = "0.1.0"
description = "Run the session crossings matching's steps from python"
requires-python = ">=3.13"
classifiers = ["Private :: Do Not Upload"]

[tool.maturin]
# Linking against libpython is what an extension module must not do; the feature is enabled
# here rather than in Cargo.toml so `cargo check --workspace` still builds this crate.
features = ["pyo3/extension-module"]
module-name = "lookout_session_crossings"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../session_crossings/Cargo.toml" },
    { file = "../session_crossings/src/**/*.rs" },
    { file = "../medallion/Cargo.toml" },
    { file = "../medallion/src/**/*.rs" },
    { file = "../medallion-model/Cargo.toml" },
    { file = "../medallion-model/src/**/*.rs" },
    { file = "../domain/Cargo.toml" },
    { file = "../domain/src/**/*.rs" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
]

[dependency-groups]
dev = [
    "pyarrow==25.0.0",
    "pytest>=9",
    "shapely==2.1.2",
]
