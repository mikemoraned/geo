[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "lookout-evaluation"
version = "0.1.0"
description = "Run the evaluation's steps from python"
requires-python = ">=3.13"
classifiers = ["Private :: Do Not Upload"]

[tool.maturin]
# Linking against libpython is what an extension module must not do; the feature is enabled
# here rather than in Cargo.toml so `cargo check --workspace` still builds this crate.
features = ["pyo3/extension-module"]
module-name = "lookout_evaluation"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../evaluation/Cargo.toml" },
    { file = "../evaluation/src/**/*.rs" },
    { file = "../medallion/Cargo.toml" },
    { file = "../medallion/src/**/*.rs" },
    { file = "../medallion-model/Cargo.toml" },
    { file = "../medallion-model/src/**/*.rs" },
    { file = "../domain/Cargo.toml" },
    { file = "../domain/src/**/*.rs" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
]

[dependency-groups]
dev = [
    # The store's own writer, so a test writes the sessions it draws from as the store holds them.
    "lookout-medallion",
    "pyarrow==25.0.0",
    "pytest>=9",
    "shapely==2.1.2",
]

[tool.uv.sources]
lookout-medallion = { path = "../medallion-py" }
